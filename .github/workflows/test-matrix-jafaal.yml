name: Test matrix jafaal

# Portability matrix on top of the fast default `test-jafaal` job:
#   * every supported Python (3.12, 3.13, 3.14) on the default SQLite backend;
#   * the suite against real Postgres and MySQL servers (proving the ORM models
#     and queries stay database-agnostic); and
#   * a bare `import jafaal` with only the base dependencies installed (no
#     mfa / sso / redis / webauthn extras, no dev groups), proving the
#     optional-feature modules import defensively.

on:
  push:
    branches:
      - master
      - main
    paths: &paths
      - jafaal/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/test-matrix-jafaal.yml
      - .github/scripts/smoke_import.py
  pull_request:
    branches:
      - master
      - main
    paths: *paths

permissions:
  contents: read

env:
  # Pin the toolchain so a uv release cannot change a CI result on its own. The
  # floor/ceiling in pyproject.toml governs which uv may *drive* the project;
  # this is which one CI actually installs.
  UV_VERSION: "0.12.5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Every supported Python version on the default SQLite backend.
  test-python-matrix:
    name: jafaal (py${{ matrix.python }} · sqlite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen --no-dev --group test --group lint --no-install-project --python ${{ matrix.python }}

      - name: Check auth import boundaries
        run: uv run --no-sync --python ${{ matrix.python }} lint-imports

      - name: Run tests
        run: uv run --no-sync --python ${{ matrix.python }} pytest

  # 2. The suite against a real PostgreSQL server.
  test-postgres:
    name: jafaal (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jafaal
          POSTGRES_PASSWORD: jafaal
          POSTGRES_DB: jafaal
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jafaal -d jafaal"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      JAFAAL_TEST_DATABASE_URL: postgresql+psycopg://jafaal:jafaal@localhost:5432/jafaal
      # A second, disposable database for the migration tests: they drop every
      # table between cases, so they must not share the one the suite is using.
      JAFAAL_TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://jafaal:jafaal@localhost:5432/jafaal_migrations
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the migrations database
        run: |
          PGPASSWORD=jafaal psql -h localhost -U jafaal -d jafaal \
            -c 'CREATE DATABASE jafaal_migrations OWNER jafaal'

      - name: Sync dependencies (with database drivers)
        run: uv sync --frozen --no-dev --group test --group test-db --no-install-project

      - name: Run tests
        run: uv run --no-sync pytest

  # 3. The suite against a real MySQL server.
  test-mysql:
    name: jafaal (mysql)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: jafaal
          MYSQL_PASSWORD: jafaal
          MYSQL_DATABASE: jafaal
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      JAFAAL_TEST_DATABASE_URL: mysql+pymysql://jafaal:jafaal@localhost:3306/jafaal
      # A second, disposable database for the migration tests: they drop every
      # table between cases, so they must not share the one the suite is using.
      JAFAAL_TEST_MIGRATIONS_DATABASE_URL: mysql+pymysql://jafaal:jafaal@localhost:3306/jafaal_migrations
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the migrations database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot \
            -e "CREATE DATABASE jafaal_migrations; GRANT ALL ON jafaal_migrations.* TO 'jafaal'@'%';"

      - name: Sync dependencies (with database drivers)
        run: uv sync --frozen --no-dev --group test --group test-db --no-install-project

      - name: Run tests
        run: uv run --no-sync pytest

  # 4. Bare import with only the base dependencies (no extras, no dev groups):
  #    proves `import jafaal` and router assembly work without mfa/sso/redis.
  import-base-deps:
    name: jafaal (bare import, no extras)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build the wheel
        run: uv build --wheel --no-sources --out-dir "$RUNNER_TEMP/dist"

      - name: Install the wheel with base dependencies only
        run: |
          uv venv "$RUNNER_TEMP/base-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/base-venv" uv pip install "$RUNNER_TEMP"/dist/*.whl

      # Run from outside the repository root so the local ``jafaal/`` package
      # directory cannot shadow the installed distribution: otherwise this would
      # validate the working tree rather than what a user actually gets.
      - name: Import jafaal and assemble the router without optional extras
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          VIRTUAL_ENV="$RUNNER_TEMP/base-venv" uv run --no-project python "$GITHUB_WORKSPACE/.github/scripts/smoke_import.py"
