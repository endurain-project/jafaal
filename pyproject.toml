[project]
name = "jafaal"
version = "0.1.0"
description = "Just Another FastAPI Authentication Library"
authors = [{name = "João Vitória Silva", email = "joao@endurain.com"}]
license = {text = "MIT"}
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.136.0",
    "sqlalchemy>=2.0.49",
    "pydantic[email]>=2.12.5",
    "joserfc>=1.6.4",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
    "authlib>=1.6.11",
    "httpx>=0.28.1",
    "user-agents>=2.2.0",
]

[dependency-groups]
typecheck = [
    "mypy>=1.20.2",
    "types-qrcode",
    "types-Authlib",
]
lint = [
    "ruff>=0.15.12",
]
test = [
    "httpx>=0.28.1",
    "faker>=40.15.0",
    "hypothesis>=6.150.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
dev = [
    "hatch>=1.16.5",
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "typecheck"},
]
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.29.0",
]

[tool.uv]
required-version = "0.11.18"
exclude-newer = "30 days"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jafaal"]

[tool.hatch.build.targets.sdist]
only-include = ["jafaal"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
lint-check = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
typecheck = "mypy"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint-check", "format-check", "test", "typecheck"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short --strict-markers --cov --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:slowapi.*",
]

[tool.coverage.run]
source = ["jafaal"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
incremental = false
check_untyped_defs = true
mypy_path = ["."]
files = ["jafaal"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "pyotp",
    "user_agents",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends/Query) — tracked in https://codeberg.org/endurain-project/endurain/issues/680
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]  # allow assert and test data with password-like strings
"jafaal/identity_providers/public_router.py" = ["S105", "S106"]  # false positive on token_type
"jafaal/schema.py" = ["S105", "S106"]  # false positive on token_type Literal defaults
"jafaal/utils.py" = ["S105", "S106"]  # false positive on cookie name constants

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
