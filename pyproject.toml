[project]
name = "jafaal"
version = "1.0.0rc1"
description = "Just Another FastAPI Authentication Library"
authors = [{name = "João Vitória Silva", email = "joao@endurain.com"}]
license = {text = "MIT"}
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.136.0",
    "sqlalchemy>=2.0.49",
    "pydantic[email]>=2.12.5",
    "joserfc>=1.6.4",
    "cryptography>=50.0.0",
    "pwdlib[argon2]>=0.3.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.9",
    "user-agents>=2.2.0",
]

[project.urls]
Homepage = "https://jafaal.endurain.com/"
Documentation = "https://jafaal.endurain.com/"
Repository = "https://github.com/endurain-project/jafaal"
Changelog = "https://github.com/endurain-project/jafaal/blob/main/CHANGELOG.md"
Issues = "https://github.com/endurain-project/jafaal/issues"
Security = "https://github.com/endurain-project/jafaal/blob/main/SECURITY.md"

# Optional features. A minimal "login + JWT + sessions" deployment needs none of
# these; the feature modules import them defensively and fail fast (with an
# install hint) if the feature is used without the extra installed.
[project.optional-dependencies]
# Multi-factor authentication (TOTP verification + QR-code provisioning).
mfa = [
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
]
# Single sign-on / OpenID Connect identity providers.
sso = [
    "authlib>=1.6.11",
]
# WebAuthn / passkeys (registration + authentication ceremonies).
webauthn = [
    "webauthn>=2.0.0",
]
# Distributed state store (shared lockout / MFA-replay across workers) via the
# jafaal.adapters.RedisStateStore adapter.
redis = [
    "redis>=5.0.0",
]
# Alembic migrations for JAFAAL's companion tables (jafaal.migrations).
migrations = [
    "alembic>=1.13",
]
# Convenience: every optional feature at once.
all = [
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
    "authlib>=1.6.11",
    "redis>=5.0.0",
    "alembic>=1.13",
    "webauthn>=2.0.0",
]

[dependency-groups]
typecheck = [
    "mypy>=1.20.2",
    "types-qrcode",
    "types-Authlib",
]
lint = [
    "ruff>=0.15.12",
    "import-linter>=2.5",
]
test = [
    "httpx>=0.28.1",
    "faker>=40.15.0",
    "hypothesis>=6.150.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    # The MFA/SSO suites exercise the optional features, so their deps are
    # required to run the full test matrix.
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.2",
    "authlib>=1.6.11",
    # The Redis state-store adapter is tested hermetically against fakeredis.
    "redis>=5.0.0",
    "fakeredis>=2.21.0",
    # The migrations suite drives the packaged Alembic revisions.
    "alembic>=1.13",
    # The WebAuthn/passkey suite exercises the registration/authentication ceremonies.
    "webauthn>=2.0.0",
    # The real-crypto passkey tests build COSE public keys for the software
    # authenticator. Transitively a py_webauthn dependency; declared explicitly
    # so the test build never relies on it implicitly.
    "cbor2>=5.6",
]
# Real database drivers for the CI database matrix (Postgres + MySQL). The
# default test run uses in-memory SQLite (built into Python) and needs neither;
# set JAFAAL_TEST_DATABASE_URL to run the suite against another backend.
test-db = [
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
]
dev = [
    "hatch>=1.16.5",
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "typecheck"},
]
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.29.0",
]

[tool.uv]
# A floor plus a minor-series ceiling rather than an exact pin: an exact
# ``==`` match makes every uv patch release a hard build failure (locally and on
# the CI runner) for no reproducibility gain — the lockfile is what pins the
# dependency set.
required-version = ">=0.12.5,<0.13"
# Supply-chain cooldown: refuse dependency versions published in the last 30
# days, so a compromised release has time to be caught before it can enter a
# build.
exclude-newer = "30 days"

# Cooldown exemptions ("0 days" = no cooldown for this package). The global
# cooldown above also delays *security* fixes, which is the wrong trade for a
# package with a published advisory: the audit workflow
# (.github/workflows/audit-jafaal.yml) fails while the fix sits behind the
# window. Exempt only the specific packages that need a fix now, so the cooldown
# keeps protecting everything else. Remove an entry once its fix is older than
# the window.
[tool.uv.exclude-newer-package]
# cryptography -- PYSEC-2026-3552, fixed in 50.0.0.
cryptography = "0 days"
# pyOpenSSL -- 26.4.0 lifts the <50 cap on cryptography required by WebAuthn.
pyopenssl = "0 days"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jafaal"]

[tool.hatch.build.targets.sdist]
# The package plus the files a downstream consumer (or a distro packager)
# needs to audit the release: licence, changelog, and security policy.
include = [
    "jafaal",
    "CHANGELOG.md",
    "LICENSE.md",
    "README.md",
    "SECURITY.md",
]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
lint-check = "ruff check ."
format-check = "ruff format --check ."
lint-imports = "lint-imports"
test = "pytest"
typecheck = "mypy"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint-check", "format-check", "lint-imports", "test", "typecheck"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short --strict-markers --cov --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:slowapi.*",
]

[tool.coverage.run]
source = ["jafaal"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
# Ratcheted to just under the current figure: high enough that a real regression
# fails the build, low enough not to trip on incidental churn. Raise it when
# coverage rises; never lower it to make a build pass.
fail_under = 87
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
incremental = false
check_untyped_defs = true
mypy_path = ["."]
files = ["jafaal"]
# The Alembic env script and revision files are convention-driven (executed by
# Alembic, not imported) and are not type-checked. The ORM model modules bind to
# a runtime-resolved base (Option B: the host owns the base), so they cannot be
# statically typed and are excluded here (and treated as untyped by importers via
# the follow_imports override below).
exclude = ["tests/", "jafaal/migrations/env\\.py$", "jafaal/migrations/versions/", "jafaal/.*/models\\.py$"]

[[tool.mypy.overrides]]
module = [
    "pyotp",
    "user_agents",
    "redis",
    "redis.exceptions",
    "alembic",
    "alembic.*",
]
ignore_missing_imports = true

# ORM model modules bind to a host-owned base resolved at runtime, so they are
# not statically typed; importers see their classes as ``Any``.
[[tool.mypy.overrides]]
module = [
    "jafaal.api_keys.models",
    "jafaal.credentials.models",
    "jafaal.identity_providers.models",
    "jafaal.identity_providers.link_tokens.models",
    "jafaal.identity_providers.links.models",
    "jafaal.mfa.backup_codes.models",
    "jafaal.mfa.models",
    "jafaal.oauth_state.models",
    "jafaal.password_reset_tokens.models",
    "jafaal.sessions.models",
    "jafaal.sessions.rotated_refresh_tokens.models",
    "jafaal.sign_up_tokens.models",
    "jafaal.webauthn.models",
]
follow_imports = "skip"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends/Query) — tracked in https://github.com/endurain-project/endurain/issues/680
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "S603"]  # allow assert, password-like test strings, and subprocess (isolated UUID-registry test)
"jafaal/__init__.py" = ["RUF022"]  # __all__ is intentionally grouped by category, not globally sorted
"jafaal/user_model.py" = ["N805"]  # SQLAlchemy @declared_attr methods receive `cls`, not `self`
"jafaal/exceptions.py" = ["RUF012"]  # class-level header dicts are immutable defaults overridden per-instance
"jafaal/audit.py" = ["S105"]  # audit event-name constants (TOKEN_*), not secrets
"jafaal/token_hashing.py" = ["S105"]  # KeyPurpose members are HKDF info labels, not secrets
"jafaal/_internal/token_manager.py" = ["S105"]  # JWT claim/header *names*, not secrets
"jafaal/_internal/services/token_admin_service.py" = ["S105", "S106"]  # false positive on the token_type audit field
"jafaal/settings.py" = ["S105"]  # false positive on the login_token_url default
"jafaal/factory.py" = ["S105"]  # false positive on the password_reset route-prefix attribute
"jafaal/identity_providers/public_router.py" = ["S105", "S106"]  # false positive on token_type
"jafaal/schema.py" = ["S105", "S106"]  # false positive on token_type Literal defaults
"jafaal/utils.py" = ["S105", "S106"]  # false positive on cookie name constants
"jafaal/adapters/static_settings.py" = ["S106"]  # false positive on the password_type policy default
"examples/**/*.py" = ["S106"]  # false positives on token_delivery / password_type keyword defaults
".github/scripts/check_conventional_commits.py" = ["T201", "W291"]  # CLI helper prints; regex string carries an intentional escaped space
".github/scripts/smoke_import.py" = ["T201"]  # CI helper reports its result on stdout

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# import-linter: architectural import contracts (run via ``lint-imports``).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "jafaal"

[[tool.importlinter.contracts]]
name = "Vendored _core utilities stay low-level"
type = "forbidden"
source_modules = ["jafaal._core"]
forbidden_modules = [
    "jafaal._internal",
    "jafaal.identity_service",
    "jafaal.dependencies",
    "jafaal.factory",
    "jafaal.router",
    "jafaal.api_keys",
    "jafaal.credentials",
    "jafaal.identity_providers",
    "jafaal.mfa",
    "jafaal.oauth_state",
    "jafaal.password_reset_tokens",
    "jafaal.sessions",
    "jafaal.sign_up_tokens",
    "jafaal.webauthn",
]

# The batteries-included adapters depend on the core (ports/orm/state_store),
# never the reverse: the core must resolve everything through the ports so a host
# can drop any adapter — and so ``import jafaal`` never pulls an adapter's
# optional dependency (e.g. redis). Enumerated (not "jafaal") so adapters'
# internal imports are not self-flagged.
[[tool.importlinter.contracts]]
name = "Batteries-included adapters stay optional (core never imports them)"
type = "forbidden"
source_modules = [
    "jafaal._core",
    "jafaal._internal",
    "jafaal.api_keys",
    "jafaal.credentials",
    "jafaal.dependencies",
    "jafaal.error_handler",
    "jafaal.exceptions",
    "jafaal.factory",
    "jafaal.identity_providers",
    "jafaal.identity_service",
    "jafaal.jwks",
    "jafaal.maintenance",
    "jafaal.mfa",
    "jafaal.oauth_state",
    "jafaal.orm",
    "jafaal.password_policy",
    "jafaal.password_reset_tokens",
    "jafaal.ports",
    "jafaal.principal",
    "jafaal.rate_limit",
    "jafaal.router",
    "jafaal.schema",
    "jafaal.scopes",
    "jafaal.sessions",
    "jafaal.settings",
    "jafaal.sign_up_tokens",
    "jafaal.state_store",
    "jafaal.token_hashing",
    "jafaal.user_model",
    "jafaal.utils",
    "jafaal.webauthn",
]
forbidden_modules = ["jafaal.adapters"]

# The framework-agnostic boundary types the host consumes must stay pure value
# types: they may lean on low-level core (``_core``/``orm``) but must not reach
# up into internals, feature packages, orchestration, or the adapters.
[[tool.importlinter.contracts]]
name = "Host-facing boundary types stay pure"
type = "forbidden"
source_modules = [
    "jafaal.ports",
    "jafaal.principal",
    "jafaal.exceptions",
]
forbidden_modules = [
    "jafaal._internal",
    "jafaal.adapters",
    "jafaal.api_keys",
    "jafaal.credentials",
    "jafaal.dependencies",
    "jafaal.factory",
    "jafaal.identity_providers",
    "jafaal.identity_service",
    "jafaal.mfa",
    "jafaal.oauth_state",
    "jafaal.password_reset_tokens",
    "jafaal.router",
    "jafaal.sessions",
    "jafaal.sign_up_tokens",
    "jafaal.utils",
    "jafaal.webauthn",
]
