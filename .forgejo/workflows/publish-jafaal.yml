name: Publish jafaal

# Builds and publishes a release to PyPI when a ``v*`` tag is pushed.
#
# Note on provenance: PEP 740 publish attestations require PyPI Trusted
# Publishing, which currently supports GitHub, GitLab, Google Cloud and
# ActiveState — not Forgejo/Codeberg. Until it does, this workflow authenticates
# with a scoped PyPI API token and instead publishes what it can produce itself:
# a CycloneDX SBOM and SHA-256 checksums, attached as build artifacts.
#
# Required secret: PYPI_TOKEN — a project-scoped PyPI API token.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify, but do not upload to PyPI
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:

  publish:
    name: build, verify and upload
    runs-on: local-runner

    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: https://data.forgejo.org/astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # A tag that disagrees with the packaged version produces a release whose
      # artifact name does not match its tag — catch it before anything is
      # uploaded, because a PyPI version can never be re-used.
      - name: Verify the tag matches the project version
        if: startsWith(forgejo.ref, 'refs/tags/v')
        env:
          TAG_REF: ${{ forgejo.ref }}
        run: |
          set -euo pipefail
          tag_version="${TAG_REF#refs/tags/v}"
          project_version="$(uv version --short)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag v${tag_version} does not match pyproject version ${project_version}." >&2
            exit 1
          fi
          echo "Releasing version ${project_version}."

      - name: Verify the changelog documents this version
        if: startsWith(forgejo.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}]' section." >&2
            exit 1
          fi

      # The full gate runs on every PR, but a tag can point anywhere in history,
      # so re-run it here: a release must never ship code that does not pass.
      - name: Sync dependencies
        run: uv sync --frozen --no-dev --group test --group lint --group typecheck

      - name: Lint, type check and test
        run: |
          set -euo pipefail
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync lint-imports
          uv run --no-sync mypy
          uv run --no-sync pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Verify package metadata renders on PyPI
        run: uvx twine check --strict dist/*

      # Prove the wheel is self-contained: install it into a clean environment
      # with no dev groups and no optional extras, then import and assemble it
      # from outside the repository (so the source tree cannot shadow it).
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          cd /tmp
          VIRTUAL_ENV=/tmp/smoke uv run --no-project python "$FORGEJO_WORKSPACE/.forgejo/scripts/smoke_import.py"

      - name: Generate SBOM (CycloneDX)
        run: uvx cyclonedx-py environment --output-format json --outfile dist/jafaal-sbom.cdx.json

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: jafaal-dist
          path: dist/
          retention-days: 90

      - name: Publish to PyPI
        if: ${{ startsWith(forgejo.ref, 'refs/tags/v') && inputs.dry-run != true }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        # The SBOM and checksums are release artifacts, not distributions.
        run: uv publish dist/*.whl dist/*.tar.gz
