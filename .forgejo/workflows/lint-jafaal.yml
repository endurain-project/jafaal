name: Lint jafaal

on:
  push:
    branches:
      - master
      - main
    paths: &paths
      - jafaal/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .forgejo/workflows/lint-jafaal.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:

  lint-jafaal:
    name: jafaal (ruff)
    runs-on: local-runner
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install uv
        uses: https://data.forgejo.org/astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Sync dependencies
        run: uv sync --frozen --only-group lint

      - name: Lint check
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .

  typecheck-jafaal:
    name: jafaal (mypy)
    runs-on: local-runner
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install uv
        uses: https://data.forgejo.org/astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Sync dependencies
        # mypy needs the runtime dependencies (fastapi, sqlalchemy, ...) importable
        # to resolve third-party types, plus the typecheck group (mypy + stubs).
        run: uv sync --frozen --no-dev --group typecheck --no-install-project

      - name: Type check
        run: uv run --no-sync mypy
