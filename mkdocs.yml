site_name: JAFAAL documentation
site_description: Just Another FastAPI Authentication Library
site_url: https://jafaal.endurain.com/
repo_url: https://codeberg.org/endurain-project/jafaal
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            separate_signature: true
            show_root_heading: true
nav:
  - Home: index.md
  - Configuration: configuration.md
  - Ports & Adapters: ports-and-adapters.md
  - Security: security.md
  - Threat model: threat-model.md
  - Key rotation: key-rotation.md
  - API Reference: api.md
